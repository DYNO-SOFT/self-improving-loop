# Categories for GitHub's generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Platforms
      labels: [codex, cursor, hermes, dsh, claude-code]
    - title: Other changes
      labels: ["*"]
