name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Manifests are valid JSON and versions are in sync
        run: |
          for f in package.json .claude-plugin/*.json .codex-plugin/*.json .cursor-plugin/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
          npm run version:check
      - name: Shell syntax
        run: bash -n hooks/*.sh
      - name: Tests (DSH cordis plugin, Hermes plugin, hook contract)
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
